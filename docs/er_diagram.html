function entPkH(e)   { return e.pkFields.length * ROW_H; }
function entAttrH(e) { return e.attrFields.length * ROW_H; }
function entH(e)     { return HDR_H + entPkH(e) + entAttrH(e) + 4; }
function cmx(e)      { return e.x + EW / 2; }
function cmy(e)      { return e.y + entH(e) / 2; }

const emap = {};
entities.forEach(e => emap[e.id] = e);

function getCardPort(e, side) {
  const h = entH(e);
  if (side === 'top')    return {x: e.x + EW / 2, y: e.y,         nx: 0,  ny: -1};
  if (side === 'bottom') return {x: e.x + EW / 2, y: e.y + h,     nx: 0,  ny: 1};
  if (side === 'left')   return {x: e.x,          y: e.y + h / 2, nx: -1, ny: 0};
  if (side === 'right')  return {x: e.x + EW,      y: e.y + h / 2, nx: 1,  ny: 0};
  return {x: cmx(e), y: cmy(e), nx: 0, ny: 1};
}

// ── STRICT CROW'S FOOT RELATIONSHIPS & CARDINALITIES ──
// Cards:
// 'one': Mandatory 1 (||)
// 'zeroOne': Optional 1 (o|)
// 'oneMany': Mandatory Many (|{)
// 'zeroMany': Optional Many (o{)
const rels = [
  // Row 1: faculties (1) -> departments (1..*)
  {f:'faculties',    t:'departments',         fc:'one',     tc:'oneMany',  lbl:'contains',        fPort:'right', tPort:'left'},
  
  // Row 1 to Row 2:
  {f:'roles',        t:'users',               fc:'one',     tc:'zeroMany', lbl:'classifies',      fPort:'bottom',tPort:'left'},
  {f:'departments',  t:'users',               fc:'zeroOne', tc:'zeroMany', lbl:'employs',         fPort:'bottom',tPort:'right'},
  {f:'faculties',    t:'users',               fc:'zeroOne', tc:'zeroOne',  lbl:'governs (dean)',  fPort:'bottom',tPort:'top'},

  // Row 2 to Row 3 (Dispatched via Horizontal Corridor Y: 890):
  {f:'users',        t:'assignments',         fc:'one',     tc:'zeroMany', lbl:'assigned_to',     fPort:'bottom',tPort:'top', corrY:890},
  {f:'users',        t:'work_requests',       fc:'one',     tc:'zeroMany', lbl:'initiates',       fPort:'bottom',tPort:'top', corrY:890},
  {f:'users',        t:'student_requests',    fc:'one',     tc:'zeroMany', lbl:'submits',         fPort:'bottom',tPort:'top', corrY:890},
  {f:'users',        t:'workload_appeals',    fc:'one',     tc:'zeroMany', lbl:'files',           fPort:'bottom',tPort:'top', corrY:890},
  {f:'users',        t:'role_promotions',     fc:'one',     tc:'zeroMany', lbl:'targets',         fPort:'bottom',tPort:'top', corrY:890},

  // Row 3 to Row 4:
  {f:'assignments',  t:'assignment_progress', fc:'one',     tc:'zeroMany', lbl:'tracks progress', fPort:'bottom',tPort:'top'},
  {f:'student_requests',t:'notifications',    fc:'one',     tc:'zeroMany', lbl:'notifies',        fPort:'bottom',tPort:'top'},
  {f:'workload_appeals',t:'audit_logs',       fc:'zeroOne', tc:'zeroMany', lbl:'audits',          fPort:'bottom',tPort:'top'},
];

// ── TEXTBOOK CROW'S FOOT SYMBOLS (Geometric Perfection) ──
function drawCard(g, ex, ey, nx, ny, card) {
  const px = -ny, py = nx; // Perpendicular direction vector
  const d1 = 8, d2 = 16;
  
  if (card === 'one') {
    // Exactly One: Two parallel vertical lines (||)
    ln(g, ex + nx*5 + px*6, ey + ny*5 + py*6, ex + nx*5 - px*6, ey + ny*5 - py*6, '#94a3b8', 1.8);
    ln(g, ex + nx*11 + px*6, ey + ny*11 + py*6, ex + nx*11 - px*6, ey + ny*11 - py*6, '#94a3b8', 1.8);
  } else if (card === 'zeroOne') {
    // Zero or One: Single vertical bar + circle (o|)
    ln(g, ex + nx*5 + px*6, ey + ny*5 + py*6, ex + nx*5 - px*6, ey + ny*5 - py*6, '#94a3b8', 1.8);
    circ(g, ex + nx*d2, ey + ny*d2, 4.5, '#0b1120', '#94a3b8');
  } else if (card === 'zeroMany') {
    // Zero or Many: Circle + 3 Crow's Foot prongs converging at entity edge (o<)
    ln(g, ex, ey, ex + nx*d1 + px*7, ey + ny*d1 + py*7, '#94a3b8', 1.6);
    ln(g, ex, ey, ex + nx*d1,         ey + ny*d1,        '#94a3b8', 1.6);
    ln(g, ex, ey, ex + nx*d1 - px*7, ey + ny*d1 - py*7, '#94a3b8', 1.6);
    circ(g, ex + nx*(d1+8), ey + ny*(d1+8), 4.5, '#0b1120', '#94a3b8');
  } else if (card === 'oneMany') {
    // One or Many: Vertical bar + 3 Crow's Foot prongs (|<)
    ln(g, ex, ey, ex + nx*d1 + px*7, ey + ny*d1 + py*7, '#94a3b8', 1.6);
    ln(g, ex, ey, ex + nx*d1,         ey + ny*d1,        '#94a3b8', 1.6);
    ln(g, ex, ey, ex + nx*d1 - px*7, ey + ny*d1 - py*7, '#94a3b8', 1.6);
    ln(g, ex + nx*(d1+7) + px*6, ey + ny*(d1+7) + py*6, ex + nx*(d1+7) - px*6, ey + ny*(d1+7) - py*6, '#94a3b8', 1.8);
  }
}

// ── SVG RENDERING ──
function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }
function sa(el, ...p) { for (let i = 0; i < p.length; i += 2) el.setAttribute(p[i], p[i+1]); return el; }

function ln(g, x1, y1, x2, y2, col, w, dash) {
  const l = ns('line');
  sa(l, 'x1', x1, 'y1', y1, 'x2', x2, 'y2', y2, 'stroke', col || C_LINE, 'stroke-width', w || 1.4);
  if (dash) sa(l, 'stroke-dasharray', dash);
  g.appendChild(l);
  return l;
}

function circ(g, cx, cy, r, fill, stroke) {
  const c = ns('circle');
  sa(c, 'cx', cx, 'cy', cy, 'r', r, 'fill', fill || '#0b1120', 'stroke', stroke || C_LINE, 'stroke-width', 1.4);
  g.appendChild(c);
}

function txt(g, x, y, text, opts = {}) {
  const t = ns('text');
  sa(t, 'x', x, 'y', y, 'font-family', 'ui-monospace,SFMono-Regular,Consolas,sans-serif', 'font-size', opts.size || 11,
     'fill', opts.fill || '#e2e8f0', 'text-anchor', opts.anchor || 'start');
  if (opts.bold) sa(t, 'font-weight', '700');
  if (opts.italic) sa(t, 'font-style', 'italic');
  t.textContent = text;
  g.appendChild(t);
  return t;
}

let scale = 0.44, tx = 30, ty = 20, drag = false, lx = 0, ly = 0;

function render() {
  const world = document.getElementById('world');
  while (world.firstChild) world.removeChild(world.firstChild);
  world.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);

  // 1. DRAW RELATIONSHIPS ALONG CORRIDORS (ZERO LINE OVERLAP)
  rels.forEach(r => {
    const fe = emap[r.f], te = emap[r.t];
    if (!fe || !te) return;

    const p1 = getCardPort(fe, r.fPort || 'bottom');
    const p2 = getCardPort(te, r.tPort || 'top');

    const g = ns('g');
    let d = '';
    let lblX = (p1.x + p2.x) / 2, lblY = (p1.y + p2.y) / 2;

    if (r.corrY) {
      d = `M${p1.x},${p1.y} V${r.corrY} H${p2.x} V${p2.y}`;
      lblX = p2.x;
      lblY = (r.corrY + p2.y) / 2;
    } else if (p1.x === p2.x) {
      d = `M${p1.x},${p1.y} V${p2.y}`;
      lblX = p1.x;
      lblY = (p1.y + p2.y) / 2;
    } else if (p1.y === p2.y) {
      d = `M${p1.x},${p1.y} H${p2.x}`;
      lblX = (p1.x + p2.x) / 2;
      lblY = p1.y;
    } else {
      const midY = (p1.y + p2.y) / 2;
      d = `M${p1.x},${p1.y} V${midY} H${p2.x} V${p2.y}`;
      lblX = (p1.x + p2.x) / 2;
      lblY = midY;
    }

    const path = ns('path');
    sa(path, 'd', d, 'fill', 'none', 'stroke', C_LINE, 'stroke-width', 1.4);
    g.appendChild(path);

    // Crow's foot markers
    drawCard(g, p1.x, p1.y, p1.nx, p1.ny, r.fc);
    drawCard(g, p2.x, p2.y, p2.nx, p2.ny, r.tc);

    // Label pill
    const bg = ns('rect');
    const w = r.lbl.length * 6.4 + 12;
    sa(bg, 'x', lblX - w/2, 'y', lblY - 8, 'width', w, 'height', 16, 'rx', 4,
       'fill', '#0b1120', 'stroke', '#334155', 'stroke-width', 0.9);
    g.appendChild(bg);

    const txtL = ns('text');
    sa(txtL, 'x', lblX, 'y', lblY + 4, 'font-family', 'ui-sans-serif,system-ui,sans-serif',
       'font-size', 9.5, 'fill', '#94a3b8', 'text-anchor', 'middle', 'font-style', 'italic');
    txtL.textContent = r.lbl;
    g.appendChild(txtL);

    world.appendChild(g);
  });

  // 2. DRAW 2-COMPARTMENT CROW'S FOOT ENTITY TABLES
  entities.forEach(ent => {
    const h = entH(ent);
    const pkH = entPkH(ent);
    const g = ns('g');

    // Outer card
    const box = ns('rect');
    sa(box, 'x', ent.x, 'y', ent.y, 'width', EW, 'height', h, 'rx', 6,
       'fill', C_ROW1, 'stroke', C_BORD, 'stroke-width', 1.5, 'filter', 'url(#shadow)');
    g.appendChild(box);

    // Header Compartment (Table Name)
    const hdr = ns('rect');
    sa(hdr, 'x', ent.x, 'y', ent.y, 'width', EW, 'height', HDR_H, 'rx', 6, 'fill', C_HDR);
    g.appendChild(hdr);
    const hdrFix = ns('rect');
    sa(hdrFix, 'x', ent.x, 'y', ent.y + HDR_H - 6, 'width', EW, 'height', 6, 'fill', C_HDR);
    g.appendChild(hdrFix);
    ln(g, ent.x, ent.y + HDR_H, ent.x + EW, ent.y + HDR_H, C_HDR_B, 1.2);

    txt(g, ent.x + EW/2, ent.y + HDR_H - 10, ent.name,
        {anchor:'middle', bold:true, size:12, fill:'#f8fafc'});

    // Primary Key Compartment (Textbook Standard: Highlighted Top Section)
    const pkBg = ns('rect');
    sa(pkBg, 'x', ent.x + 1, 'y', ent.y + HDR_H, 'width', EW - 2, 'height', pkH, 'fill', C_PK_BG);
    g.appendChild(pkBg);

    ent.pkFields.forEach((f, i) => {
      const ry = ent.y + HDR_H + i * ROW_H;
      txt(g, ent.x + 8, ry + ROW_H - 6, f.t, {fill:'#64748b', size:9});
      txt(g, ent.x + TW + 4, ry + ROW_H - 6, f.n, {fill:C_PK, bold:true, size:10});

      const kx = ent.x + EW - KW + 4;
      const kbg = ns('rect');
      sa(kbg, 'x', kx, 'y', ry + 3, 'width', KW - 8, 'height', ROW_H - 6, 'rx', 4,
         'fill', '#ef444420', 'stroke', '#ef444460', 'stroke-width', 0.8);
      g.appendChild(kbg);
      txt(g, kx + (KW - 8)/2, ry + ROW_H - 6, 'PK',
          {anchor:'middle', fill:C_PK, bold:true, size:8.5});
    });

    // Prominent Separator Line between PK and Non-Key Attributes (IDEF1X Standard)
    const pkDivY = ent.y + HDR_H + pkH;
    ln(g, ent.x, pkDivY, ent.x + EW, pkDivY, '#ef444480', 1.4);

    // Non-Key Attributes Compartment
    ent.attrFields.forEach((f, i) => {
      const ry = pkDivY + i * ROW_H;
      if (i % 2 === 1) {
        const rowBg = ns('rect');
        sa(rowBg, 'x', ent.x + 1, 'y', ry, 'width', EW - 2, 'height', ROW_H, 'fill', C_ROW2);
        g.appendChild(rowBg);
      }
      if (i < ent.attrFields.length - 1) {
        ln(g, ent.x, ry + ROW_H, ent.x + EW, ry + ROW_H, '#1e293b', 0.8);
      }

      txt(g, ent.x + 8, ry + ROW_H - 6, f.t, {fill:'#64748b', size:9});

      const isFk = f.k === 'FK', isUk = f.k === 'UK';
      const colFill = isFk ? C_FK : isUk ? C_UK : '#cbd5e1';
      txt(g, ent.x + TW + 4, ry + ROW_H - 6, f.n, {fill:colFill, bold:isFk, size:10});

      if (f.k) {
        const kx = ent.x + EW - KW + 4;
        const kbg = ns('rect');
        const bgCol = isFk ? '#38bdf820' : '#10b98120';
        const bdrCol = isFk ? '#38bdf860' : '#10b98160';
        sa(kbg, 'x', kx, 'y', ry + 3, 'width', KW - 8, 'height', ROW_H - 6, 'rx', 4,
           'fill', bgCol, 'stroke', bdrCol, 'stroke-width', 0.8);
        g.appendChild(kbg);
        txt(g, kx + (KW - 8)/2, ry + ROW_H - 6, f.k,
            {anchor:'middle', fill:colFill, bold:true, size:8.5});
      }
    });

    // Vertical Column Separators
    ln(g, ent.x + TW, ent.y + HDR_H, ent.x + TW, ent.y + h, '#334155', 0.8);
    ln(g, ent.x + EW - KW, ent.y + HDR_H, ent.x + EW - KW, ent.y + h, '#334155', 0.8);

    world.appendChild(g);
  });
}

function fitView() {
  const vp = document.getElementById('vp');
  const cw = vp.clientWidth, ch = vp.clientHeight;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  entities.forEach(e => {
    minX = Math.min(minX, e.x); minY = Math.min(minY, e.y);
    maxX = Math.max(maxX, e.x + EW); maxY = Math.max(maxY, e.y + entH(e));
  });
  const bw = maxX - minX + 120, bh = maxY - minY + 120;
  scale = Math.min(cw / bw, ch / bh, 0.95);
  tx = (cw - bw * scale) / 2 - minX * scale + 60 * scale;
  ty = (ch - bh * scale) / 2 - minY * scale + 60 * scale;
  render();
}

function resetView() { scale = 0.44; tx = 30; ty = 20; render(); }

const vp = document.getElementById('vp');
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const d = e.deltaY > 0 ? 0.9 : 1 / 0.9;
  tx = mx - (mx - tx) * d;
  ty = my - (my - ty) * d;
  scale *= d;
  render();
}, {passive:false});

vp.addEventListener('mousedown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
vp.addEventListener('mousemove', e => {
  if (!drag) return;
  tx += e.clientX - lx; ty += e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  render();
});
vp.addEventListener('mouseup', () => drag = false);
vp.addEventListener('mouseleave', () => drag = false);
window.addEventListener('load', () => { render(); setTimeout(fitView, 100); });
</script>
